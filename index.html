<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard APM</title>
<style>
:root{--bg:#0b1220;--pn:#131d33;--ln:#22304d;--tx:#e8eefc;--mu:#8fa0c4;--ac:#22d3ee;--ok:#34d399;--wr:#fbbf24;--er:#f87171}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:28px;width:100%;max-width:380px}
h1{font-size:20px;margin:0 0 4px}.mu{color:var(--mu)}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--ln);background:#0e1730;color:var(--tx);padding:10px 12px}
.box input{width:100%;margin-top:10px}button{cursor:pointer;background:var(--ac);color:#04222b;border:0;font-weight:700}
.box button{width:100%;margin-top:14px}#err{color:var(--er);margin-top:8px;min-height:18px}
#app{display:none;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--pn);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
header b{font-size:16px;letter-spacing:.5px}#clk{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:700}
.wrap{display:flex}nav{width:230px;padding:14px;border-right:1px solid var(--ln);min-height:calc(100vh - 56px)}
nav a{display:block;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mu);margin-bottom:4px;transition:.2s}
nav a:hover{background:#18264a;color:var(--tx);transform:translateX(3px)}nav a.on{background:var(--ac);color:#04222b;font-weight:700}
main{flex:1;padding:18px;min-width:0}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar h2{margin:0 auto 0 0;font-size:18px;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;animation:up .4s}
.card small{color:var(--mu)}.card b{display:block;font-size:24px;margin-top:4px}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.tw{overflow:auto;border:1px solid var(--ln);border-radius:12px;max-height:520px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{background:#0e1730;position:sticky;top:0}
.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
.alert{background:#3b2a07;border:1px solid var(--wr);color:var(--wr);padding:10px 14px;border-radius:10px;margin-bottom:12px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.6}}.pn{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.kv div{background:#0e1730;border-radius:8px;padding:8px 10px}
@media(max-width:760px){.wrap{display:block}nav{width:auto;min-height:0;display:flex;overflow:auto;border:0;padding:8px}nav a{white-space:nowrap}}
</style></head><body>
<div id="login"><div class="box"><h1>Dashboard APM</h1><div class="mu">Silakan login dengan NIK Karyawan</div>
<input id="nik" placeholder="NIK Karyawan" inputmode="numeric"><input id="pw" type="password" placeholder="Password">
<button onclick="login()">Login</button><div id="err"></div></div></div>
<div id="app"><header><b id="ttl">DASHBOARD APM</b><span><span id="usr" class="mu"></span> &nbsp; <span id="clk"></span> &nbsp; <button onclick="logout()">Keluar</button></span></header>
<div class="wrap"><nav id="nav"></nav><main><div class="bar"><h2 id="mt"></h2><select id="fm" onchange="S.m=this.value;S.auto=0;draw()"></select><select id="fy" onchange="S.y=this.value;draw()"></select><span class="mu" id="upd"></span></div><div id="out"></div></main></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzYf-ZJgv-e12p2oasAlsFhe3Uk8eIGO-LNaQ4UrO1ooGcOSzjdBg-W8fzWdCqgPaXnyA/exec
';
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const LBL={absensi:'Rekap Absensi',kpi:'Format KPI Teknisi',wo:'WO APM',barang:'Form APM Keluar & Masuk Barang',jadwal:'Jadwal Install Megavision',slip:'Database Slip Gaji - PT Aksara Perdana Multimedia'};
const $=i=>document.getElementById(i),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(localStorage.apm||'null')||{};S.D={};S.q='';S.auto=1;
async function api(b){const r=await fetch(API,{method:'POST',body:JSON.stringify(b)});return r.json()}
function save(){const {t,name,nik,menus,menu}=S;localStorage.apm=JSON.stringify({t,name,nik,menus,menu})}
async function login(){const er=$('err');if(API.indexOf('GANTI')>=0){er.textContent='URL Apps Script belum diisi di index.html (baris const API)';return}
 er.style.color='#8fa0c4';er.textContent='Memproses login, mohon tunggu (bisa 10-20 detik pertama kali)...';let r;
 try{r=await api({a:'login',nik:$('nik').value,pw:$('pw').value})}catch(e){er.style.color='';er.textContent='Gagal terhubung. Pastikan Web App di-deploy: Execute as Me, akses Anyone, URL berakhiran /exec';return}
 er.style.color='';if(!r.ok){er.textContent=r.err;return}er.textContent='';Object.assign(S,r,{menu:r.menus[0]});save();start()}
function logout(){localStorage.removeItem('apm');location.reload()}
function start(){$('login').style.display='none';$('app').style.display='block';$('usr').textContent=S.name+' ('+S.nik+')';
 $('nav').innerHTML=S.menus.map(m=>`<a id="n_${m}" onclick="go('${m}')">${LBL[m]}</a>`).join('');go(S.menu&&S.menus.includes(S.menu)?S.menu:S.menus[0])}
function go(m){S.menu=m;S.m='';S.y='';S.auto=1;S.q='';save();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.id=='n_'+m));$('mt').textContent=LBL[m];$('out').innerHTML='<div class="mu">Memuat data...</div>';load()}
async function load(extra){const m=S.menu;let r;try{r=await api({t:S.t,menu:m,name:extra})}catch(e){$('upd').textContent='Koneksi gagal, mencoba lagi...';return}
 if(r.auth===false)return logout();if(!r.ok){$('out').innerHTML='<div class="er">'+E(r.err)+'</div>';return}
 if(m=='slip'&&extra){S.slipRow=r.d.row}else S.D[m]=r.d;$('upd').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID');draw()}
setInterval(()=>{$('clk').textContent=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'medium'})},1000);
setInterval(()=>{if(S.t&&S.menu)load(S.menu=='slip'?S.slipName:undefined)},60000);
/* ---- tanggal ---- */
const BM={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
function pd(s){s=String(s||'').trim();let a;
 if(a=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return new Date(+a[3],a[2]-1,+a[1]);
 if(a=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return new Date(+a[1],a[2]-1,+a[3]);
 if(a=s.match(/^(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ](\d{4})/)){const m=BM[a[2].toLowerCase()];if(m!=null)return new Date(+a[3],m,+a[1])}return null}
function periods(rows,get){const s=new Set();rows.forEach(r=>{const d=pd(get(r));if(d)s.add(d.getFullYear()*100+d.getMonth())});return [...s].sort((a,b)=>b-a)}
function setFilters(ps,showM=true){$('fy').style.display='';const ys=[...new Set(ps.map(p=>Math.floor(p/100)))];if(!S.y||!ys.includes(+S.y))S.y=ys[0]||'';
 const ms=ps.filter(p=>Math.floor(p/100)==S.y).map(p=>p%100);if(S.m===''||!ms.includes(+S.m))S.m=ms[0]??'';
 $('fy').innerHTML=ys.map(y=>`<option ${y==S.y?'selected':''}>${y}</option>`).join('');
 $('fm').style.display=showM?'':'none';$('fm').innerHTML=ms.map(m=>`<option value="${m}" ${m==S.m?'selected':''}>${MN[m]}</option>`).join('')}
const inP=(d,y,m)=>d&&d.getFullYear()==y&&d.getMonth()==m;
const tbl=(h,rows,cls)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${E(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${cls?cls(c,i):''}">${E(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
function draw(){const d=S.D[S.menu];if(S.menu=='slip')return slip(d);if(!d)return;({wo,kpi,barang,absensi,jadwal})[S.menu](d)}
/* ---- WO ---- */
function wo(rows){const mp=new Map();rows.forEach(r=>mp.set(r.wo,r)); // yang terakhir = terbaru
 const u=[...mp.values()].map(r=>{const t=(r.rem||'')+' '+(r.st||'');let s=String(r.st||'').toUpperCase().trim();
  if(/done|terinstal|installed|complete/i.test(r.rem||''))s='DONE';else if(/cancel|batal/i.test(r.rem||''))s='CANCEL';
  else if(/^CANCEL/.test(s))s='CANCEL';else if(/^PEND/.test(s))s='PENDING';else if(/DONE|COMPLETE/.test(s))s='DONE';return{...r,s,d:pd(r.tgl)}});
 setFilters(periods(u,r=>r.tgl));const f=u.filter(r=>inP(r.d,S.y,S.m)),n=f.length,c=k=>f.filter(r=>r.s==k).length,p=k=>n?(c(k)/n*100).toFixed(1)+'%':'0%';
 const days=new Date(S.y,+S.m+1,0).getDate(),tot=Array(days).fill(0),dn=Array(days).fill(0);f.forEach(r=>{tot[r.d.getDate()-1]++;if(r.s=='DONE')dn[r.d.getDate()-1]++});
 const q=S.q.toLowerCase(),sh=f.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
 $('out').innerHTML=`<div class="cards"><div class="card"><small>Total Work Order</small><b>${n}</b></div><div class="card"><small>Done</small><b class="ok">${c('DONE')} <small>${p('DONE')}</small></b></div><div class="card"><small>Pending</small><b class="wr">${c('PENDING')} <small>${p('PENDING')}</small></b></div><div class="card"><small>Cancel</small><b class="er">${c('CANCEL')} <small>${p('CANCEL')}</small></b></div></div>
 <div class="pn"><b>Work Order per Tanggal - ${MN[S.m]} ${S.y}</b>${line(tot,dn)}</div>
 <div class="bar"><input id="sq" placeholder="Cari WO / customer / teknisi..." value="${E(S.q)}" oninput="S.q=this.value;wo(S.D.wo)" style="flex:1"></div>
 ${tbl(['No','Tanggal','Work Order Number','Customer','District','Teknisi','Status','Keterangan','Update Remark'],sh.map((r,i)=>[i+1,r.tgl,r.wo,r.cust,r.dist,r.tek,r.s,r.ket,r.rem]),(c,i)=>i==6?(c=='DONE'?'ok':c=='PENDING'?'wr':'er'):'')}
 <div class="mu" style="margin-top:6px">WO Number kembar dihitung 1 (data terbaru). Update Remark berisi "done/terinstal" dihitung Done.</div>`;
 const e=$('sq');if(e&&S.q){e.focus();e.setSelectionRange(S.q.length,S.q.length)}}
function line(a,b){const W=760,H=200,P=28,mx=Math.max(1,...a),x=i=>P+i*(W-2*P)/Math.max(1,a.length-1),y=v=>H-P-v*(H-2*P)/mx;
 const pl=(s,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${s.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+s.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}"><title>Tgl ${i+1}: ${v}</title></circle>`).join('');
 return `<div style="overflow:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:560px;width:100%">${[0,.5,1].map(t=>`<line x1="${P}" x2="${W-P}" y1="${y(mx*t)}" y2="${y(mx*t)}" stroke="#22304d"/><text x="2" y="${y(mx*t)+4}" fill="#8fa0c4" font-size="10">${Math.round(mx*t)}</text>`).join('')}
 ${a.map((_,i)=>`<text x="${x(i)}" y="${H-8}" fill="#8fa0c4" font-size="9" text-anchor="middle">${i+1}</text>`).join('')}${pl(a,'#22d3ee')}${pl(b,'#34d399')}</svg></div><small class="mu"><span style="color:#22d3ee">&#9632;</span> Total WO &nbsp;<span style="color:#34d399">&#9632;</span> Done</small>`}
/* ---- KPI ---- */
function kpi(d){const ks=Object.keys(d.months);setFilters([],false);$('fm').style.display='';$('fy').innerHTML=`<option>${d.year}</option>`;
 if(!ks.includes(S.m))S.m=ks[ks.length-1];$('fm').innerHTML=ks.map(k=>`<option ${k==S.m?'selected':''}>${k}</option>`).join('');
 const m=d.months[S.m],rows=m.rows,v=rows.map(r=>parseFloat(String(r[6]).replace(',','.'))||0),hi=Math.max(...v),lo=Math.min(...v);
 const nm=x=>rows.filter((r,i)=>v[i]==x).map(r=>r[1]).join(', ');
 $('out').innerHTML=`<div class="cards"><div class="card"><small>Tertinggi &#9650;</small><b class="ok" style="font-size:17px">${E(nm(hi))}</b><small>${hi}%</small></div><div class="card"><small>Terendah &#9660;</small><b class="er" style="font-size:17px">${E(nm(lo))}</b><small>${lo}%</small></div></div>
 ${tbl(['ID Karyawan','Nama Karyawan','Target Bulanan','Realisasi Pemasangan','Target Harian','Realisasi Harian','% Pencapaian','Predikat Kinerja'],rows.concat(m.avg?[m.avg]:[]),(c,i)=>i==7?(/KURANG/.test(c)?'er':'ok'):'')}`}
/* ---- Barang ---- */
function barang(d){const all=d.masuk.concat(d.keluar);setFilters(periods(all,r=>r[0]));const sum=(a,k)=>a.filter(r=>inP(pd(r[0]),S.y,S.m)&&r[1]==k).reduce((s,r)=>s+(+r[3]||0),0);
 const low=d.rekap.filter(r=>{const t=(+r[2]||0)+(+r[3]||0);return t>0&&(+r[6])<=t*.3});
 $('out').innerHTML=(low.length?`<div class="alert">Stok hampir Habis, Segera Request: ${low.map(r=>E(r[1].trim())+' (sisa '+r[6]+')').join(', ')}</div>`:'')+
 tbl(['Kode Barang','Nama Barang','Stok Awal','Barang Masuk','Barang Keluar','Barang Rusak','Stok Akhir','Masuk '+MN[S.m],'Keluar '+MN[S.m]],d.rekap.map(r=>r.concat([sum(d.masuk,r[0]),sum(d.keluar,r[0])])),(c,i)=>i==6&&low.some(l=>l[6]==c)?'er':'')+
 `<div class="mu" style="margin-top:6px">Peringatan muncul bila Stok Akhir &le; 30% dari (Stok Awal + Barang Masuk).</div>`}
/* ---- Absensi ---- */
function absensi(d){const H=d.headers,f=re=>H.find(h=>re.test(h)),cd=f(/tanggal|date/i),cn=f(/nama/i),cs=f(/status/i),cl=f(/terlambat|telat|late/i);
 setFilters(periods(d.rows,r=>r[cd]));const rows=d.rows.filter(r=>inP(pd(r[cd]),S.y,S.m)),emp={};
 rows.forEach(r=>{const k=r[cn]||'-';emp[k]=emp[k]||{h:0,l:0};const off=cs&&/off|alpa|alpha|izin|cuti|sakit|libur/i.test(r[cs]);if(!off)emp[k].h++;
  const lv=cl?String(r[cl]).trim():'';if(lv&&!/^(0|-|00:00(:00)?|tidak|tepat.*|no)$/i.test(lv)&&(!/^\d+$/.test(lv)||+lv>0)&&!off)emp[k].l++});
 const rk=Object.entries(emp).sort((a,b)=>b[1].l-a[1].l||b[1].h-a[1].h);
 $('out').innerHTML=`<div class="pn"><b>Total hadir & keterlambatan - ${MN[S.m]} ${S.y}</b>${tbl(['Nama','Total Hadir','Terlambat (kali)'],rk.map(([k,v])=>[k,v.h,v.l]),(c,i)=>i==2&&c>0?'wr':'')}</div><b>Log Absensi</b><div style="height:8px"></div>${tbl(H,rows.slice(-300).reverse().map(r=>H.map(h=>r[h])))}
 ${cl?'':'<div class="mu">Kolom keterlambatan tidak ditemukan di sheet; hitung terlambat butuh kolom bernama mengandung "terlambat".</div>'}`}
/* ---- Jadwal ---- */
function jadwal(d){const H=d.headers,f=re=>H.find(h=>re.test(h)),cd=f(/tanggal|tgl|date|jadwal/i),cv=f(/nilai|poin|score/i);
 setFilters(periods(d.rows,r=>r[cd]));const now=new Date(),tg=new Date(now.getFullYear(),now.getMonth(),now.getDate()+(now.getHours()>=17?1:0));
 const same=r=>{const x=pd(r[cd]);return x&&+x==+tg},mo=d.rows.filter(r=>inP(pd(r[cd]),S.y,S.m)),sel=S.auto?d.rows.filter(same):mo,tot=cv?sel.reduce((s,r)=>s+(parseFloat(String(r[cv]).replace(',','.'))||0),0):'';
 $('out').innerHTML=`<div class="cards"><div class="card"><small>${S.auto?'Install Scheduled '+tg.toLocaleDateString('id-ID',{dateStyle:'full'}):'Jadwal '+MN[S.m]+' '+S.y}</small><b>${sel.length}</b></div>${cv?`<div class="card"><small>Total Nilai</small><b>${tot}</b></div>`:''}
 <div class="card"><small>Tampilan</small><button onclick="S.auto=!S.auto;jadwal(S.D.jadwal)" style="margin-top:6px">${S.auto?'Lihat satu bulan':'Kembali ke hari ini/besok'}</button></div></div>
 ${sel.length?tbl(H,sel.map(r=>H.map(h=>r[h]))):'<div class="mu">Belum ada jadwal.</div>'}<div class="mu" style="margin-top:6px">Setiap pukul 17.00 tampilan otomatis berganti ke jadwal esok hari.</div>`}
/* ---- Slip ---- */
function slip(d){if(!d)return;setFilters([]);$('fm').style.display=$('fy').style.display='none';
 $('out').innerHTML=`<div class="pn"><input id="sn" list="nl" placeholder="Cari nama karyawan..." value="${E(S.slipName||'')}" style="width:100%" onchange="S.slipName=this.value;S.slipRow=null;load(this.value)"><datalist id="nl">${(d.names||[]).map(n=>`<option value="${E(n)}">`).join('')}</datalist></div>
 ${S.slipRow?`<div class="pn"><b>${E(S.slipName)}</b><div class="kv" style="margin-top:10px">${Object.entries(S.slipRow).filter(x=>x[1]!=='').map(([k,v])=>`<div><small class="mu">${E(k)}</small><br><b>${E(v)}</b></div>`).join('')}</div></div>`:''}`}
if(API.indexOf('GANTI')<0&&S.t)start();
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&$('login').style.display!='none')login()});
</script></body></html>
