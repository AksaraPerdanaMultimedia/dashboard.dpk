<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APM DEPOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1f;--side:#0d1430;--panel:#121b3a;--panel2:#0b1431;--line:#1f2b52;--tx:#e8edfb;--mu:#8793b8;--ac:#5b8cff;--ac2:#8b5cf6;--ok:#22c55e;--wr:#f59e0b;--er:#ef4444;--glow:rgba(91,140,255,.35)}
html[data-theme=light]{--bg:#eef2fa;--side:#ffffff;--panel:#ffffff;--panel2:#f5f7fd;--line:#dde4f3;--tx:#18213d;--mu:#65719a;--glow:rgba(91,140,255,.22)}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 Poppins,"Segoe UI",system-ui,sans-serif;color:var(--tx);min-height:100vh;background:var(--bg);transition:background .4s,color .4s}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.9;background:radial-gradient(900px 500px at 0% 100%,rgba(139,92,246,.18),transparent 60%),radial-gradient(800px 480px at 100% 0%,rgba(91,140,255,.16),transparent 60%)}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto;transition:background .4s}
.brand{padding:10px 8px 28px;text-align:center}
.brand b{display:block;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:800;letter-spacing:.08em;line-height:1.15;background:linear-gradient(90deg,var(--ac),var(--ac2),#22d3ee,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:300% auto;animation:shine 5s linear infinite}
.brand span{display:block;color:var(--mu);font-size:14px;font-weight:500;letter-spacing:.02em;margin-top:12px}
@keyframes shine{to{background-position:200% center}}
.sect{font-size:11px;letter-spacing:.14em;color:var(--mu);padding:10px 10px 8px;text-transform:uppercase}
nav a{position:relative;overflow:hidden;display:block;padding:11px 14px;border-radius:12px;color:var(--tx);cursor:pointer;margin-bottom:6px;font-weight:500;transition:transform .25s,background .25s,box-shadow .25s}
nav a:after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transition:left .7s}
nav a:hover{transform:translateX(5px);background:rgba(91,140,255,.1)}
nav a:hover:after{left:130%}
nav a.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 22px var(--glow);font-weight:700}
main{padding:24px 28px;min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:20px}
.head h1{margin:0;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.head p{margin:6px 0 0;color:var(--mu);font-size:13px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input,button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .2s,box-shadow .2s}
button{cursor:pointer}button:hover{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
select:focus,input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.clock{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-variant-numeric:tabular-nums;color:var(--ac);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);margin-bottom:16px;min-width:0;animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;animation:rise .45s ease both;transition:transform .25s,box-shadow .25s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--ac))}
.kpi .l{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mu);font-size:12px;margin-top:4px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.sec-t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-t h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.04em}.sec-t small{color:var(--mu)}
.tw{overflow:auto;border:1px solid #dfe5f5;border-radius:14px;max-height:520px;background:#fff;color:#1c2540}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid #eef1f8;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#f1f4fb;color:#4a5680;font-size:11px;letter-spacing:.06em;text-transform:uppercase;z-index:1}
tr:nth-child(even) td{background:#fafbff}tr:hover td{background:#eef3ff;transition:background .2s}
td.empty{text-align:center;color:#8a93b0;padding:24px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.p-ok{background:#dcfce7;color:#166534}.p-wr{background:#fef3c7;color:#92400e}.p-er{background:#fee2e2;color:#991b1b}.p-in{background:#e0e7ff;color:#3730a3}
.bar{height:6px;background:#e5e9f5;border-radius:999px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:999px}
.alert{border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start}
.alert.red{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.5);color:#fecaca}
.alert.amber{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.5);color:#fde68a}
.alert b{display:block;letter-spacing:.04em;margin-bottom:4px;font-size:14px}
.blink{animation:pulseRed 1.6s infinite}.blink-a{animation:pulseAmb 1.6s infinite}
@keyframes pulseRed{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@keyframes pulseAmb{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}70%{box-shadow:0 0 0 12px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.5);color:#fecaca;border-radius:14px;padding:14px 16px}
html[data-theme=light] .alert{color:#1f2937}
html[data-theme=light] .alert.red{color:#7f1d1d;background:rgba(239,68,68,.14);border-color:rgba(220,38,38,.6)}
html[data-theme=light] .alert.amber{color:#78350f;background:rgba(245,158,11,.2);border-color:rgba(217,119,6,.6)}
html[data-theme=light] .err{color:#7f1d1d;background:rgba(239,68,68,.1)}
.kpi.clk{cursor:pointer}.kpi.act{box-shadow:0 0 0 2px var(--ac),0 14px 30px rgba(0,0,0,.15)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.legend{display:flex;gap:14px;color:var(--mu);font-size:12px;margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.search{width:280px;max-width:100%;margin:0}
.rank{list-style:none;padding:0;margin:0}
.rank li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kv>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.grp{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 12px;margin:14px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase;border-radius:10px;user-select:none;transition:background .2s,color .2s}
.grp:hover{background:rgba(91,140,255,.08);color:var(--tx)}
.arr{font-size:12px}
.sub{padding-left:8px;border-left:2px solid var(--line);margin-left:12px}
#thm{position:absolute;opacity:0;width:0;height:0;margin:0;padding:0;border:0}
.tg{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--tx);font-weight:600;font-size:13px;user-select:none}
.tr{position:relative;width:78px;height:34px;border-radius:999px;background:var(--line);transition:background .3s;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--line)}
.tr:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tr:before{content:"OFF";position:absolute;right:9px;top:9px;font-size:11px;font-weight:700;color:var(--mu)}
#thm:checked+.tr{background:linear-gradient(90deg,var(--ac),var(--ac2))}
#thm:checked+.tr:after{transform:translateX(44px)}
#thm:checked+.tr:before{content:"ON";right:auto;left:10px;color:#fff}
#thm:focus-visible+.tr{box-shadow:0 0 0 3px var(--glow)}
@media(max-width:980px){
 .layout{grid-template-columns:1fr}
 aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}
 .brand{text-align:center;padding:0 0 10px}
 nav{display:flex;gap:6px;overflow:auto}nav a{white-space:nowrap;margin:0}nav .sect{display:none}
 .two{grid-template-columns:1fr}main{padding:16px}
}
</style>
</head>
<body>
<div class="layout">
<aside>
 <div class="brand"><b>APM DEPOK</b><span>PT Aksara Perdana Multimedia</span></div>
 <div class="sect">Menu</div>
 <nav id="nav"></nav>
</aside>
<main>
 <div class="head">
  <div><h1 id="ttl">Overview</h1><p id="upd">Memuat data...</p></div>
  <div class="ctl"><div id="ctl" class="ctl"></div><label class="tg"><span>Mode Siang</span><input type="checkbox" id="thm" onchange="setTheme(this.checked?'light':'dark')"><span class="tr"></span></label><span class="clock" id="clk"></span></div>
 </div>
 <div id="out"></div>
</main>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycby-9g5_OCHczxadP9p3zi3jbxMlege6misl7EmYXTlFtRwujwlXZc84ZY7HLfZ25zCQqA/exec';
const BARANG_LIMIT=0.3;   // batas stok: Stok Akhir <= 30% dari Stok Awal
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const LBL={absensi:'ABSENSI',kpi:'KPI',wo:'WO APM',barang:'WAREHOUSE',jadwal:'JADWAL INSTALL',slip:'SLIP GAJI'};
const $=i=>document.getElementById(i);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={menu:localStorage.apmMenu||'',k:'',auto:1,q:'',D:{},wf:'ALL',bf:'ALL',bq:''};
const R={};

async function api(b){const r=await fetch(API,{method:'POST',body:JSON.stringify(b)});return r.json()}

/* ---------- tema ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.apmTheme=t;$('thm').checked=(t==='light')}
function applyTheme(t){setTheme(t)}
applyTheme(localStorage.apmTheme||'dark');

/* ---------- tanggal ---------- */
const MO={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
function pd(s){s=String(s||'').trim();let a;
 if(a=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))return new Date(+a[1],a[2]-1,+a[3]);
 if(a=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){let y=+a[3];if(y<100)y+=2000;return new Date(y,a[2]-1,+a[1])}
 if(a=s.match(/(\d{1,2})[\s-]+([A-Za-z]{3})[A-Za-z]*[\s,-]+(\d{4})/)){const m=MO[a[2].toLowerCase()];if(m!=null)return new Date(+a[3],m,+a[1])}
 return null}
const ym=d=>d.getFullYear()*100+d.getMonth();
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
// Periode absensi 20 s/d 19. Kunci = bulan tempat periode berakhir (tanggal 19).
function perKey(d){let y=d.getFullYear(),m=d.getMonth();if(d.getDate()>=20){m++;if(m>11){m=0;y++}}return y*100+m}
function perRange(k){const y=Math.floor(k/100),m=k%100;return [new Date(y,m-1,20),new Date(y,m,19,23,59,59)]}
const sh=d=>d.getDate()+' '+MN[d.getMonth()].slice(0,3);
function perLabel(k){const [a,b]=perRange(k);return `Periode ${MN[k%100]} ${Math.floor(k/100)} (${sh(a)} – ${sh(b)} ${b.getFullYear()})`}
const monLabel=k=>MN[k%100]+' '+Math.floor(k/100);
function keysOf(list,fn){return [...new Set(list.map(fn).filter(x=>x!=null))].sort((a,b)=>b-a)}
function pick(keys){if(!keys.length)return null;if(!keys.includes(+S.k))S.k=String(keys[0]);return +S.k}
const opts=(keys,cur,lab)=>keys.map(k=>`<option value="${k}" ${k==cur?'selected':''}>${E(lab(k))}</option>`).join('');
const setCtl=h=>{$('ctl').innerHTML=h||''};

/* ---------- komponen ---------- */
const empty=t=>`<div class="panel" style="text-align:center;color:var(--mu);padding:40px">${E(t||'Belum ada data')}</div>`;
const card=(l,v,s,c,click,on)=>`<div class="kpi${click?' clk':''}${on?' act':''}" ${click?`onclick="${click}"`:''} style="--c:${c||'var(--ac)'}"><div class="l">${E(l)}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const pill=(t,k)=>({h:`<span class="pill p-${k}">${E(t)}</span>`});
const bar=p=>({h:`<div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div><span>${p.toFixed(1)}%</span></div>`});
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c&&c.h!=null?c.h:E(c)}</td>`).join('')}</tr>`).join('')||`<tr><td class="empty" colspan="${h.length}">Tidak ada data</td></tr>`}</tbody></table></div>`;

function line(a,b){const W=720,H=240,P=34,mx=Math.max(4,...a);
 const x=i=>P+i*(W-2*P)/Math.max(1,a.length-1),y=v=>H-P-v/mx*(H-2*P);
 const path=s=>s.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 const area=path(a)+` L${x(a.length-1).toFixed(1)},${H-P} L${x(0).toFixed(1)},${H-P} Z`;
 const grid=[0,.25,.5,.75,1].map(t=>{const v=Math.round(mx*t);return `<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-8}" y="${y(v)+4}" fill="var(--mu)" font-size="11" text-anchor="end">${v}</text>`}).join('');
 const xl=a.map((_,i)=>(i%2===0||a.length<=16)?`<text x="${x(i)}" y="${H-10}" fill="var(--mu)" font-size="11" text-anchor="middle">${i+1}</text>`:'').join('');
 const dots=a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#5b8cff"><title>Tgl ${i+1}: ${v} WO</title></circle>`).join('');
 return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px">
 <defs><linearGradient id="gA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5b8cff" stop-opacity=".45"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></linearGradient></defs>
 ${grid}<path d="${area}" fill="url(#gA)"/><path d="${path(a)}" fill="none" stroke="#5b8cff" stroke-width="2.5"/><path d="${path(b)}" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>${dots}${xl}</svg></div>
 <div class="legend"><span><i style="background:#5b8cff"></i>Total WO</span><span><i style="background:#22c55e"></i>Done</span></div>`}

/* ---------- alur data ---------- */
async function start(){
 if(API.indexOf('GANTI')>=0){$('out').innerHTML=empty('Isi URL Apps Script pada baris const API di index.html');$('upd').textContent='Konfigurasi belum lengkap';return}
 let r;try{r=await api({a:'menus'})}catch(e){$('out').innerHTML='<div class="err">Gagal terhubung ke Apps Script. Pastikan URL benar dan deploy: Execute as Me, akses Anyone.</div>';return}
 if(!r.ok){$('out').innerHTML=`<div class="err">${E(r.err)}</div>`;return}
 S.menus=r.menus;
 $('nav').innerHTML='<a id="n_dashboard" onclick="go(\'dashboard\')">DASHBOARD</a>'
 +'<div class="grp" onclick="toggleGrp()"><span>MENU</span><span id="arr" class="arr">▸</span></div>'
 +'<div id="grp" class="sub" style="display:none">'+S.menus.map(m=>`<a id="n_${m}" onclick="go('${m}')">${E(LBL[m])}</a>`).join('')+'</div>';
 go((S.menu==='dashboard'||S.menus.includes(S.menu))?S.menu:'dashboard');
}
function go(m){S.menu=m;S.k='';S.auto=1;S.q='';S.wf='ALL';S.bf='ALL';S.bq='';localStorage.apmMenu=m;
 if(m!=='dashboard')$('grp').style.display='block',$('arr').textContent='▾';
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.id==='n_'+m));
 $('ttl').textContent=m==='dashboard'?'DASHBOARD':LBL[m];setCtl('');
 if(m==='dashboard'){drawOverview();loadAll();return}
 if(S.D[m])draw();else $('out').innerHTML='<div class="panel" style="color:var(--mu)">Memuat data...</div>';
 load()}
function toggleGrp(){const g=$('grp');const open=g.style.display==='none';g.style.display=open?'block':'none';$('arr').textContent=open?'▾':'▸'}
async function loadAll(){if(!S.menus)return;
 const res=await Promise.all(S.menus.map(m=>api({menu:m,name:''}).then(r=>[m,r]).catch(()=>[m,null])));
 res.forEach(([m,r])=>{if(r&&r.ok)S.D[m]=r.d});
 $('upd').textContent='Diperbarui '+new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})+' · otomatis setiap 1 menit';
 if(S.menu==='dashboard')drawOverview()}
function drawOverview(){
 setCtl('');
 const W=S.D.wo?woNorm(S.D.wo):[];const keys=keysOf(W,r=>ym(r.d));const k=keys[0];
 const f=k!=null?W.filter(r=>ym(r.d)===k):[];const n=f.length,c=t=>f.filter(r=>r.s===t).length,pc=t=>n?(c(t)/n*100).toFixed(1)+'%':'0%';
 const B=S.D.barang;let low=0,rusakT=0,akhirT=0;
 if(B){low=B.rekap.filter(r=>{const aw=+r[2]||0;return aw>0&&(+r[6])<=aw*BARANG_LIMIT}).length;
   rusakT=B.rekap.reduce((s,r)=>s+(+r[5]||0),0);akhirT=B.rekap.reduce((s,r)=>s+(+r[6]||0),0)}
 const pv=x=>parseFloat(String(x).replace('%','').replace(',','.'))||0;
 let topN='-',topP='';
 const KP=S.D.kpi;
 if(KP&&KP.months&&Object.keys(KP.months).length){const kk=Object.keys(KP.months).slice(-1)[0];
   const best=KP.months[kk].rows.slice().sort((a,b)=>pv(b[6])-pv(a[6]))[0];if(best){topN=best[1];topP=best[6]}}
 let hadir='-',late='-',per='Belum ada data';
 const AB=S.D.absensi;
 if(AB&&AB.headers&&AB.headers.length){const H=AB.headers,f2=re=>H.find(h=>re.test(h));
   const cd=f2(/tanggal|date/i),cs=f2(/status/i);
   if(cd){const ds=AB.rows.map(r=>pd(r[cd])).filter(Boolean);const ks=keysOf(ds,x=>perKey(x));
     if(ks.length){const kk=ks[0],[a,b]=perRange(kk);per=perLabel(kk).replace('Periode ','');let h=0,l=0;
       AB.rows.forEach(r=>{const x=pd(r[cd]);if(!x||x<a||x>b)return;const st=cs?String(r[cs]||'').trim():'';

 </div>
 <div class="panel"><div class="sec-t"><h3>Sumber Data</h3><small>Sheet Depok · tanggal pada sel B12</small></div>
  <div class="kv"><div><div style="color:var(--mu);font-size:11px;text-transform:uppercase">Tanggal di sheet (B12)</div><b>${E(d.tgl||'-')}</b></div>
  <div><div style="color:var(--mu);font-size:11px;text-transform:uppercase">Nilai Install Scheduled</div><b>${E(d.val||'-')}</b></div></div>
  <p style="color:var(--mu);font-size:12px;margin-bottom:0">Nilai diperbarui otomatis setiap 1 menit. Setelah pukul 17.00 sheet berisi data esok hari.</p></div>`};

/* ---------- Slip gaji (opsional, dimatikan di Code.gs) ---------- */
function slipView(d){setCtl('');
 $('out').innerHTML=`<div class="panel" style="max-width:720px"><div class="sec-t"><h3>Cari Slip Gaji</h3><small>Ketik nama karyawan lalu pilih</small></div>
 <input list="nl" class="search" style="width:100%" placeholder="Nama karyawan..." value="${E(S.slipName||'')}" onchange="S.slipName=this.value;S.slipRow=null;load(this.value)">
 <datalist id="nl">${(d.names||[]).map(n=>`<option value="${E(n)}">`).join('')}</datalist></div>
 ${S.slipRow?`<div class="panel" style="max-width:720px"><h3 style="margin-top:0">${E(S.slipName)}</h3><div class="kv">${Object.entries(S.slipRow).filter(x=>x[1]!=='').map(([k,v])=>`<div><div style="color:var(--mu);font-size:11px;text-transform:uppercase">${E(k)}</div><b>${E(v)}</b></div>`).join('')}</div></div>`:''}`}

/* ---------- jam & refresh ---------- */
const tick=()=>{$('clk').textContent=new Date().toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})};
tick();setInterval(tick,1000);
setInterval(()=>{if(!S.menus)return;if(S.menu==='dashboard')loadAll();else if(S.menu!=='slip')load()},60000);
start();
</script>
</body>
